<section class="auth-card">
  <h1>Zaboravljena lozinka</h1>
  <p>Unesi email adresu povezanu s računom. Ako račun postoji, poslat ćemo link za postavljanje nove lozinke.</p>

  <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email">
      <mat-error *ngIf="form.controls.email.hasError('required')">Email je obavezan.</mat-error>
      <mat-error *ngIf="form.controls.email.hasError('email')">Unesi ispravnu email adresu.</mat-error>
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || submitting">
      {{submitting ? 'Šaljem…' : 'Pošalji link za reset'} }
    </button>
  </form>

  <p *ngIf="submitted" class="success-message" role="status">
    Ako postoji račun s tom adresom, poslan je link za promjenu lozinke. Provjeri email.
  </p>
  <a routerLink="/auth/login">Nazad na prijavu</a>
</section>
